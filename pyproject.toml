[project]
name = "voltdragon"
version = "0.1.0"
description = "Plant model and ground station for the VoltDragon power-line inspection UAV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gs = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "robotframework==6.1", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sim*", "ground_station*"]

[tool.setuptools.package-data]
"sim.plant" = ["routes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
